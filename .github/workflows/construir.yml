name: Construir ejecutable

# Publica NotaVideo.exe como release al empujar una etiqueta v*,
# y permite construirlo a mano para probar.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Verificar regresiones
        run: python -m unittest -v test_notavideo

      - name: Construir
        run: pyinstaller --noconfirm NotaVideo.spec

      - name: Guardar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: NotaVideo
          path: dist/NotaVideo.exe

      - name: Publicar en el release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NotaVideo.exe
