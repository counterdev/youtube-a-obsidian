name: Construir ejecutable

# Publica NotaVideo.exe como release al empujar una etiqueta v*,
# y permite construirlo a mano para probar.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  construir:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Verificar regresiones
        run: python -m unittest -v test_notavideo

      # El runner de Windows no trae ffmpeg y el .spec lo empaqueta dentro del
      # .exe. Sin este paso se publicaria un ejecutable que solo puede bajar
      # los formatos que YouTube entrega ya combinados, unos 360p.
      #
      # Se descarga un build estatico en vez de usar Chocolatey porque
      # Chocolatey instala shims que redirigen al binario real: empaquetar un
      # shim deja un .exe roto.
      - name: Obtener ffmpeg
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          foreach ($programa in "ffmpeg", "ffprobe") {
            $origen = Get-ChildItem ffmpeg-tmp -Recurse -Filter "$programa.exe" |
                      Select-Object -First 1
            if (-not $origen) { throw "No se encontro $programa en el archivo descargado" }
            Copy-Item $origen.FullName .
          }
          ./ffmpeg.exe -version | Select-Object -First 1

      - name: Construir
        run: pyinstaller --noconfirm NotaVideo.spec

      - name: Guardar el ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: NotaVideo
          path: dist/NotaVideo.exe

      - name: Publicar en el release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/NotaVideo.exe
